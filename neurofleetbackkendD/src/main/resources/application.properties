spring.application.name=neurofleetbackkendD

# Server Configuration
server.port=${PORT:8083}
ai.service.url=${AI_SERVICE_URL}


# MySQL Database Configuration (Using Environment Variables)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?sslMode=REQUIRED&useSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Using Environment Variables)
jwt.secret=${JWT_SECRET:NeuroFleetXSecretKey2024SuperSecureKeyForJWTAuthentication}
jwt.expiration=86400000

frontend.url=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.neurofleetbackkendD=DEBUG
